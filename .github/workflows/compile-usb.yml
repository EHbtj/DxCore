name: AVR DU native USB

on:
  pull_request:
    paths:
      - "megaavr/cores/**"
      - "megaavr/*.txt"
      - "megaavr/bootloaders/euboot/**"
      - "megaavr/tools/euboot_upload.py"
      - "megaavr/tools/tests/**"
      - "megaavr/extras/ci/**"
      - "megaavr/libraries/DxCore/examples/USB/**"
      - ".github/actions/setup-usb-build/**"
      - ".github/workflows/compile-usb.yml"
  push:
    paths:
      - "megaavr/cores/**"
      - "megaavr/*.txt"
      - "megaavr/bootloaders/euboot/**"
      - "megaavr/tools/euboot_upload.py"
      - "megaavr/tools/tests/**"
      - "megaavr/extras/ci/**"
      - "megaavr/libraries/DxCore/examples/USB/**"
      - ".github/actions/setup-usb-build/**"
      - ".github/workflows/compile-usb.yml"
  workflow_dispatch:

env:
  ARDUINO_DIRECTORIES_USER: ${{ github.workspace }}/.usb-ci/sketchbook
  ARDUINO_DIRECTORIES_DATA: ${{ github.workspace }}/.usb-ci/data
  ARDUINO_DIRECTORIES_DOWNLOADS: ${{ github.workspace }}/.usb-ci/downloads

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Exercise bootloader handlers with address and undefined-behavior sanitizers
        env:
          CXX: g++
          EUBOOT_REQUIRE_COMPILER: "1"
          EUBOOT_SANITIZE: "1"
        run: python -m unittest discover -s megaavr/tools/tests -p test_euboot_firmware.py -v

  usb:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Uploader and distributed asset tests
        run: python -m unittest discover -s megaavr/tools/tests -v
      - uses: ./.github/actions/setup-usb-build
      - name: Compile native USB examples and API contract
        shell: pwsh
        run: >-
          python megaavr/extras/ci/compile_usb.py
          --fqbn DxCoreUSB:megaavr:avrduusb
          --build-root "${{ runner.temp }}/usb-default"
          megaavr/libraries/DxCore/examples/USB/SerialUSBEcho
          megaavr/libraries/DxCore/examples/USB/SerialUSBAndUART
          megaavr/extras/ci/test-sketch/usb/UARTRegression
          megaavr/extras/ci/test-sketch/usb/StreamAPI
          megaavr/extras/ci/test-sketch/all/dummysketch
      - name: Compile configurable clock, watchdog and library modes
        shell: pwsh
        run: >-
          python megaavr/extras/ci/compile_usb.py
          --fqbn DxCoreUSB:megaavr:avrduusb:clock=24internal,usbWDTtimeout=63msec,usbWDTwindow=125msec,millis=disabled,printf=full,attach=manual,wiremode=mands,flmap=unlocked
          --build-root "${{ runner.temp }}/usb-options"
          megaavr/libraries/DxCore/examples/USB/SerialUSBEcho
          megaavr/extras/ci/test-sketch/usb/StreamAPI
      - name: Compile regulator example on AVR128DB64
        run: >-
          arduino-cli compile
          --fqbn DxCoreUSB:megaavr:avrdb:chip=avr128db64
          megaavr/libraries/AzduinoMAX38903/examples/MAX38903_MVIO_demo

  standalone:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mcu: [avr64du32, avr32du32, avr64du28, avr32du28]
        power: [regulator, external]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-usb-build
      - name: Compile standalone USB examples and API contract
        shell: pwsh
        run: >-
          python megaavr/extras/ci/compile_usb.py
          --fqbn DxCoreUSB:megaavr:avrduusb_generic:chip=${{ matrix.mcu }},usbpower=${{ matrix.power }},clock=16internal,usbWDTtimeout=8seconds,usbWDTwindow=1second,millis=disabled,printf=full,flmap=locksection0
          --mcu ${{ matrix.mcu }}
          --build-root "${{ runner.temp }}/standalone-usb"
          megaavr/libraries/DxCore/examples/USB/SerialUSBEcho
          megaavr/extras/ci/test-sketch/usb/UARTRegression
          megaavr/extras/ci/test-sketch/usb/StreamAPI
